name: CI

# Chạy khi mở/cập nhật PR vào develop hoặc main, và khi code được merge vào hai nhánh đó.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

# Push commit mới vào cùng một PR thì huỷ lần chạy cũ cho đỡ tốn thời gian.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: analyze, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Phiên bản Flutter lấy từ .fvmrc để CI và máy dev dùng cùng một bản.
      - name: Read Flutter version
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Install packages
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # Lỗi (error) và cảnh báo (warning) làm CI đỏ; gợi ý (info) chỉ hiện ra để sửa dần.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build Android (debug)
        run: flutter build apk --debug
